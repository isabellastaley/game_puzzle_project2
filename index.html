<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Isabella Staley Individual Project 2: Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <p>To play, simply click on the "cell" blocks in the table to arrange the scrambled numbers in sequential order.</p>
        <p>Achieve the best play against your rivals with as much less moves as possible, in the shortest period of time!</p>
        
        <p>Number of Moves thus far: <span id="counter">0</span></p>
        <p>Time spent in the current game: <span id="timer">0</span> seconds.</p>

        <button id="simpleButton">Simple Game!</button>
        <button id="newButton">New Game</button>

        <table id="puzzlegrid">
            <tr id="row1">
                <td id="cell11" onclick="clickTile(1,1)"></td>
                <td id="cell12" onclick="clickTile(1,2)"></td>
                <td id="cell13" onclick="clickTile(1,3)"></td>
                <td id="cell14" onclick="clickTile(1,4)"></td>
            </tr>
            <tr id="row2">
                <td id="cell21" onclick="clickTile(2,1)"></td>
                <td id="cell22" onclick="clickTile(2,2)"></td>
                <td id="cell23" onclick="clickTile(2,3)"></td>
                <td id="cell24" onclick="clickTile(2,4)"></td>
            </tr>
            <tr id="row3">
                <td id="cell31" onclick="clickTile(3,1)"></td>
                <td id="cell32" onclick="clickTile(3,2)"></td>
                <td id="cell33" onclick="clickTile(3,3)"></td>
                <td id="cell34" onclick="clickTile(3,4)"></td>
            </tr>
            <tr id="row4">
                <td id="cell41" onclick="clickTile(4,1)"></td>
                <td id="cell42" onclick="clickTile(4,2)"></td>
                <td id="cell43" onclick="clickTile(4,3)"></td>
                <td id="cell44" onclick="clickTile(4,4)"></td>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
